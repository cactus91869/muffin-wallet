adminUser: admin
adminPassword: admin

persistence:
  enabled: true
  size: 10Gi

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        url: http://loki.monitoring.svc.cluster.local:3100
        access: proxy
        isDefault: true
      - name: Zipkin
        type: zipkin
        url: http://zipkin.monitoring.svc.cluster.local:9411
        access: proxy
      # - name: Prometheus
      #   type: prometheus
      #   url: http://prometheus.monitoring.svc.cluster.local:9090
      #   access: proxy

dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards

dashboards:
  default:
    loki-dashboard:
      gnetId: 13639
      revision: 1
      datasource: Loki
    tracing-dashboard:
      gnetId: 13998
      revision: 1
      datasource: Zipkin

service:
  type: NodePort
  port: 3000
  nodePort: 30030

ingress:
  enabled: true
  hosts:
    - grafana.local

initChownData:
  enabled: false
